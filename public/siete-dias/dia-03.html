function scrollTopImmediately(){document.documentElement.scrollTop=0;document.body.scrollTop=0;window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0))}
function render(){root.dataset.stage=stage;document.querySelectorAll('.steps i').forEach((el,i)=>el.classList.toggle('on',i===['arrival','investigate','verdict','letter'].indexOf(stage)));let html='';
if(stage==='arrival')html=`<section class="scene intro" aria-labelledby="arrival-title"><div class="kicker">EXPEDIENTE CONFIDENCIAL · PARA ${esc(gift.recipient.toUpperCase())}</div><h1 id="arrival-title">Tenemos<br><em>un caso, mi amor.</em></h1><p class="lead">Un misterio muy serio llegó al departamento del amor.</p><div class="bruno-area">${BRUNO}<span class="spark a" aria-hidden="true">✦</span><span class="spark b" aria-hidden="true">♥</span></div><div class="speech"><strong>“Se reportó un corazón robado…<br>y todas las pistas llevan a vos.”</strong><small>— Bruno, inspector de asuntos románticos</small></div><button type="button" class="action" data-action="investigate">Abrir el expediente <span>↗</span></button><p class="whisper">No te preocupes: este detective solo busca besos.</p></section>`;
if(stage==='investigate'){let n=revealed.filter(Boolean).length;html=`<section class="scene investigate" aria-labelledby="case-title"><div class="kicker">INVESTIGACIÓN EN CURSO · CASO Nº 003</div><h2 id="case-title">Las pruebas<br><em>no mienten.</em></h2><p class="lead">Bruno encontró tres pistas. Tocá cada una para revelar por qué está tan seguro de que fuiste vos.</p><div class="casefile"><div class="paperclip" aria-hidden="true"></div><div class="case-header"><span>DEPARTAMENTO DEL AMOR<br>ARCHIVO RESERVADO</span><span class="case-number">CASO #003</span></div><div class="evidence-list">${evidence.map((ev,i)=>`<button type="button" class="evidence ${revealed[i]?'revealed':''}" data-evidence="${i}" aria-label="${revealed[i]?'Pista revelada: '+ev.title:'Revelar pista '+(i+1)}" aria-pressed="${revealed[i]}"><span class="index">0${i+1}</span><span class="evidence-text"><span class="eyebrow">${esc(ev.tag)}</span>${revealed[i]?`<span class="value">${esc(ev.title)}</span><span class="hidden-value">${esc(ev.detail)}</span>`:`<span class="hidden-value">Tocá para descubrir la prueba…</span>`}</span><span class="mark ${revealed[i]?'done':''}" aria-hidden="true">${revealed[i]?'✓':'✧'}</span></button>`).join('')}</div></div><div class="invest-progress"><div class="row"><span>PISTAS DESCUBIERTAS</span><strong>${n} / 3</strong></div><div class="track"><span style="width:${n/3*100}%"></span></div></div><button type="button" class="action" data-action="stamp" ${n===3?'':'disabled'}>Dictar sentencia <span>✦</span></button><p class="hint" role="status">${n===3?'No quedan dudas. El veredicto te está esperando.':'Investigá las tres pruebas para continuar.'}</p></section>`}
if(stage==='verdict')html=`<section class="scene verdict" aria-labelledby="verdict-title"><div class="kicker">SENTENCIA · CASO Nº 003</div><h2 id="verdict-title">Veredicto<br><em>irrevocable.</em></h2><p class="lead">El inspector Bruno examinó todas las pruebas y llegó a una sola conclusión.</p><div class="verdict-document"><div class="document-stamp-top">DEPARTAMENTO DEL AMOR · ACTA OFICIAL</div><div class="document-title">Se declara a ${esc(gift.recipient)}…</div><div class="stamp" role="img" aria-label="Sello que dice culpable de enamorarme"><strong>CULPABLE</strong><em>de enamorarme</em></div><div class="case-meta">SENTENCIA FIRME · SIN DERECHO A APELACIÓN</div></div><div class="confetti" aria-hidden="true"><b>♥</b><b>♥</b><b>✦</b><b>♥</b><b>✦</b><b>♥</b></div><button type="button" class="action" data-action="letter">Leer la sentencia de amor <span>♡</span></button><p class="whisper">La condena: dejar que te quiera muchísimo.</p></section>`;
if(stage==='letter')html=`<section class="scene letter-scene" aria-labelledby="letter-title"><div class="kicker">UNA CARTITA SOLO PARA VOS</div><article class="letter"><div class="heart">♡</div><div class="to">DE ${esc(gift.sender.toUpperCase())} · PARA ${esc(gift.recipient.toUpperCase())}</div><h2 id="letter-title">${esc(gift.letterTitle)}</h2>${(gift.letterParagraphs||[]).map(p=>`<p class="copy">${esc(p)}</p>`).join('')}<div class="rule">— ✦ —</div><div class="signature">${esc(gift.signature)}</div><div class="from">— ${esc(gift.sender)}</div></article><div class="tomorrow"><div class="done">✓</div><div><strong>Tercera sorpresa entregada.</strong><p>${esc(gift.tomorrow)}</p></div></div><button type="button" class="outline" data-action="replay">↺ Vivirla otra vez</button></section>`;
area.innerHTML=html;scrollTopImmediately()}
root.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn||!root.contains(btn))return;const ev=btn.dataset.evidence;if(ev!==undefined){let n=Number(ev);if(stage!=='investigate'||!Number.isInteger(n)||n<0||n>2||revealed[n])return;revealed[n]=true;buzz([12,24,10]);chime(revealed.every(Boolean)?[522,659,784,1047]:[620,830]);render();return}
const action=btn.dataset.action;if(action==='investigate'){stage='investigate';buzz(12);chime([620,830]);render()}else if(action==='stamp'&&revealed.every(Boolean)){stage='verdict';buzz([20,35,28]);chime([523,659,784,1046]);render()}else if(action==='letter'){stage='letter';finished=true;buzz(14);chime([784,988,880]);render()}else if(action==='replay'){stage='arrival';revealed=[false,false,false];render()}});
render();
</script>
