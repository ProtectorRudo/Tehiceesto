<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9efee"><meta name="description" content="Día 2 de 7 días de amor: sos ridículamente besable.">
<title>Sos ridículamente besable · Día 2 · Te Hice Esto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap');
:root{--ink:#49323f;--rose:#b52f67;--rose2:#d87d9f;--cream:#fffdf8;--muted:#9c7f8d}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;font-family:'DM Sans',system-ui,sans-serif;background:#f5e8ea;color:var(--ink)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #a82e62;outline-offset:4px}
#app{min-height:100svh;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 33%,#fffef9 0%,#fff9f1 42%,#f7e8eb 72%,#eddbe2 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 80% 30%,#fde4eb,transparent 35%),radial-gradient(ellipse at 12% 76%,#f4d7c5,transparent 35%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#ab8c95 .55px,transparent .7px);background-size:12px 12px}
.float{position:absolute;pointer-events:none;color:#dca1b1;animation:twinkle 4s ease-in-out infinite;font-size:24px}.float.a{left:7%;top:27%}.float.b{right:8%;top:41%;animation-delay:1s;color:#d0b094}.float.c{right:14%;bottom:20%;animation-delay:2s;color:#e2b0c4}
.top,.bottom{width:min(100%,1000px);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.top{min-height:45px}.bottom{font-size:8px;letter-spacing:.145em;font-weight:800;color:#b19aa3;min-height:28px;margin-top:10px}
.brand{font-size:12px;font-weight:800;letter-spacing:.125em;line-height:1.1}.brand span{color:#c54375;font-size:17px}.brand small{display:block;margin-top:6px;color:#b48794;font-size:8px;letter-spacing:.2em}
.tools{display:flex;gap:8px;align-items:center}.sound,.day{border:1px solid #edcfd8;border-radius:999px;background:#fffdf9a3;color:#9e6880;padding:10px 12px;white-space:nowrap;font-size:10px}.sound{display:flex;align-items:center;gap:6px;height:36px}.sound[aria-pressed=true]{background:#fff0f4;border-color:#e4a6bd}.sound strong{font-size:10px}.day strong{font-size:13px;color:#843954}.day em{font-style:normal;color:#b38d98}
.stage{width:100%;flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}.scene{width:min(100%,560px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:appear .5s cubic-bezier(.17,.7,.24,1) both}.kicker{font-size:9px;font-weight:800;letter-spacing:.19em;color:#b07588;line-height:1.5;margin:12px 0 9px;text-transform:uppercase}.lead{font-size:13px;line-height:1.65;color:var(--muted);max-width:365px;margin:12px 0 0;text-wrap:balance}.lead b{color:#7b5365}
h1,h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.04em;margin:0;line-height:.94}h1{font-size:clamp(56px,10vw,86px)}h2{font-size:clamp(54px,8vw,74px)}h1 em,h2 em{color:#bc406f;font-weight:400}
.bunny-wrap{position:relative;width:min(91vw,345px);height:clamp(250px,38svh,350px);display:flex;align-items:center;justify-content:center;margin:-4px 0 0}.bunny-wrap:before{content:"";position:absolute;width:100%;height:80%;top:12%;background:radial-gradient(ellipse,#f8d6d68d,transparent 72%);filter:blur(8px)}
.bunny{width:100%;height:100%;filter:drop-shadow(0 12px 10px rgba(156,102,118,.2));animation:bob 4.6s ease-in-out infinite}.bunny .ear-left,.bunny .ear-right{transform-origin:center bottom;animation:earwig 3.5s ease-in-out infinite}.bunny .sign{transform-origin:286px 218px;animation:swing 5s ease-in-out infinite}
.speech{border:1px solid #eed3db;border-radius:17px;padding:15px 25px 12px;background:#fffdfaf5;box-shadow:0 16px 38px #9f617621;position:relative;margin:8px 0 17px;max-width:360px}.speech:before{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);border-left:1px solid #eed3db;border-top:1px solid #eed3db;background:#fffdfa}.speech .line{font:italic 400 clamp(23px,4vw,28px)/1.15 'Instrument Serif',Georgia,serif;color:#774459;display:block}.speech .caption{display:block;margin-top:8px;font-size:9px;color:#ae8e9a;letter-spacing:.055em}
.action,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;gap:13px;border-radius:999px;padding:13px 27px;font-size:12px;font-weight:800;letter-spacing:.005em;transition:.22s transform,.22s background,.22s box-shadow}.action{background:#b62f64;color:#fff;border:1px solid #b62f64;box-shadow:0 12px 28px #b83b6a42}.action:hover{transform:translateY(-3px);background:#a02257}.secondary{background:#fffaf9c7;color:#8e4d68;border:1px solid #e2c1ce}.action:active,.secondary:active{transform:scale(.97)}
.whisper{font-size:10px;color:#ae929b;margin:12px 0 0;line-height:1.6}
.flipzone{width:min(100%,430px);display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:6px}.sign-card{position:relative;width:min(92vw,292px);height:195px;border-radius:24px;background:linear-gradient(180deg,#fffefd,#fff6f6);border:1px solid #ecd7df;box-shadow:0 18px 38px rgba(141,88,107,.15);perspective:1000px}.sign-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.75,.18,1)}.sign-card.flipped .sign-inner{transform:rotateY(180deg)}.sign-face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px}.sign-face.front{background:linear-gradient(180deg,#fffdfb,#fff6f8)}.sign-face.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#fff5f7,#fffef9 70%)}.mini-pill{padding:8px 12px;border-radius:999px;background:#fff1f6;border:1px solid #efc7d6;color:#b54a74;font-size:10px;font-weight:800;letter-spacing:.09em;margin-bottom:10px}.sign-title{font:italic 400 28px/1.08 'Instrument Serif',Georgia,serif;color:#714559;margin:0}.sign-copy{font-size:12px;line-height:1.65;color:#9b7f8b;max-width:190px;margin-top:8px}.sign-reveal{font:italic 400 clamp(38px,8vw,52px)/1.02 'Instrument Serif',Georgia,serif;color:#bb3f6e;text-wrap:balance}.sign-sub{margin-top:10px;font-size:11px;color:#9d8190;letter-spacing:.04em}
.tapnote{font-size:11px;color:#a07f8d;line-height:1.6;max-width:280px}.stamp-hearts{position:absolute;inset:0;pointer-events:none}.stamp-hearts span{position:absolute;font-size:20px;color:#df88a8;animation:twinkle 4s ease-in-out infinite}.stamp-hearts span:nth-child(1){left:16px;top:18px}.stamp-hearts span:nth-child(2){right:18px;top:28px;animation-delay:1.1s}.stamp-hearts span:nth-child(3){right:30px;bottom:22px;animation-delay:2.2s}
.letter{width:min(100%,420px);padding:44px 36px 34px;background:linear-gradient(155deg,#fffdf7,#fff8ef);border:1px solid #e7cfbc;box-shadow:0 25px 55px rgba(128,82,104,.15),0 2px 0 #fff inset;position:relative;border-radius:6px;text-align:center;animation:open .65s cubic-bezier(.17,.72,.2,1) both}.letter:before{content:"";position:absolute;inset:12px;border:1px solid #ecdacc;pointer-events:none}.letter .seal{font:36px 'Instrument Serif',Georgia,serif;color:#b75278}.letter .label{font-size:9px;line-height:1.6;letter-spacing:.15em;color:#b08a91;margin:10px auto 11px;font-weight:750;max-width:270px}.letter h2{font:italic 400 clamp(36px,5vw,50px)/1 'Instrument Serif',Georgia,serif;letter-spacing:-.01em;color:#78455c;margin:12px 0 20px}.paragraph{font:italic 400 clamp(19px,3vw,23px)/1.39 'Instrument Serif',Georgia,serif;color:#6b4b57;margin:0 0 17px}.rule{color:#c99da7;margin:15px 0;font-size:12px}.signature{font:italic 36px 'Instrument Serif',Georgia,serif;color:#b33f70;margin:0}.from{font:italic 19px 'Instrument Serif',Georgia,serif;color:#a57a84;margin:7px 0 0}
.tomorrow{display:flex;gap:12px;align-items:flex-start;background:#fffaf8b5;border:1px solid #ead7db;border-radius:14px;margin:23px auto 16px;padding:15px 17px;width:min(100%,390px);text-align:left}.done{flex-shrink:0;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#bd4e79;color:#fff;font-size:13px}.tomorrow strong{font-size:12px;color:#684757}.tomorrow p{font-size:11px;line-height:1.55;color:#9b7b87;margin:6px 0 0}
.steps{display:flex;gap:5px}.steps i{height:4px;width:12px;background:#e6c6d1;border-radius:99px;transition:width .25s,background .25s}.steps i.on{width:25px;background:#b83d6d}
@keyframes appear{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes earwig{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes open{0%{opacity:0;transform:translateY(32px) rotate(-4deg) scale(.92)}100%{opacity:1;transform:none}}
@media(max-width:540px){.brand{font-size:10px}.brand small{font-size:7px}.sound,.day{font-size:9px;padding:9px 10px}.top{min-height:39px}h1{font-size:clamp(52px,14vw,70px)}h2{font-size:clamp(50px,12vw,67px)}.lead{font-size:12px}.bunny-wrap{height:280px}.speech{padding:14px 20px 10px}.speech .line{font-size:23px}.sign-card{height:185px}.letter{padding:36px 22px 28px}.paragraph{font-size:20px}}
@media(max-width:370px){#app{padding-left:12px;padding-right:12px}.top{gap:5px}.day,.sound{padding:7px 9px;font-size:8px}.brand small{font-size:6px}.bunny-wrap{height:240px}.action,.secondary{min-height:47px;padding:12px 18px;font-size:11px}.sign-card{height:174px;border-radius:20px}.sign-face{padding:20px}.sign-title{font-size:24px}.sign-reveal{font-size:35px}.paragraph{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* PREMIUM AUDIT v3 — cartel 3D fluido */

.sign-card{cursor:pointer;outline-offset:6px;transform:rotate(-2deg);transition:transform .35s ease,box-shadow .35s ease;isolation:isolate}
.sign-card:hover,.sign-card:focus-visible{transform:rotate(0deg) translateY(-3px);box-shadow:0 24px 45px #a15a7326}
.sign-card .sign-inner{transition:transform .94s cubic-bezier(.19,.7,.17,1);transform:rotateY(0deg);backface-visibility:hidden}
.sign-card.flipped .sign-inner{transform:rotateY(180deg)}
.sign-card .back{background:radial-gradient(ellipse at 50% 30%,#fffefb 0%,#fff2f6 73%,#f3dce4 100%)}
.sign-card .back:before,.sign-card .front:after{content:'✧';position:absolute;color:#d69bad;font-size:24px;left:15px;top:15px;opacity:.7}
.sign-card .back:after{content:'♥';position:absolute;color:#dcabc1;font-size:19px;right:17px;bottom:13px;opacity:.8}
.sign-card .back .sign-reveal{text-shadow:0 2px 1px #fff,0 7px 24px #c3839a26}
.scene button[hidden]{display:none!important}
.letter-in{animation:lunaButton .6s .28s both}
@keyframes lunaButton{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sign-card .sign-inner{transition:none}}

</style>

</head>
<body>
<div id="app">
  <div class="grain"></div>
  <span class="float a">✧</span><span class="float b">♥</span><span class="float c">✦</span>
  <header class="top"><div class="brand">TE HICE ESTO <span>♥</span><small>UN POQUITO DE MÍ, CADA DÍA</small></div><div class="tools"><button class="sound" id="sound" aria-pressed="false">♪ <strong>OFF</strong></button><div class="day">DÍA <strong>02</strong> <em>/ 07</em></div></div></header>
  <main class="stage" id="stage"></main>
  <footer class="bottom"><span>HECHO CON AMOR, ESPECIALMENTE PARA VOS</span><div class="steps"><i id="s1" class="on"></i><i id="s2"></i><i id="s3"></i></div></footer>
</div>
<script>
const gift={recipient:window.TEHICEESTO_GIFT?.recipient||'Lucía',sender:window.TEHICEESTO_GIFT?.sender||'Martín',tomorrow:'Mañana te espera otra sorpresa todavía más traviesa.',letterTitle:'Oficialmente.',letterParagraphs:['No sé si te lo dicen lo suficiente, pero tenés algo que me vuelve completamente loco/a.','Tu carita, tu forma de mirar y esa ternura tuya hacen que siempre me den ganas de besarte un poquito más.','Así que sí: queda oficialmente asentado que sos ridículamente besable.'],signature:'Te amo.',...window.TEHICEESTO_GIFT?.days?.[2]};
let stage='arrival';let signFlipped=false;let soundOn=false;const root=document.getElementById('app');const area=document.getElementById('stage');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function vibrate(x){try{if('vibrate' in navigator)navigator.vibrate(x)}catch(e){}}
function chime(seq){if(!soundOn||!window.AudioContext)return;try{const a=new AudioContext();if(a.state==='suspended')a.resume();const t=a.currentTime;seq.forEach((hz,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(hz,t+i*.09);g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.021,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.32);o.connect(g).connect(a.destination);o.start(t+i*.09);o.stop(t+i*.09+.34)});setTimeout(()=>a.close(),1000)}catch(e){}}
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.innerHTML=(soundOn?'♫':'♪')+' <strong>'+(soundOn?'ON':'OFF')+'</strong>'});
const BUNNY=`<svg class="bunny" viewBox="0 0 430 420" role="img" aria-label="Conejito tierno con cartel romántico" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="fur" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f1d4cc"/></linearGradient><linearGradient id="pink" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7c2d4"/><stop offset="1" stop-color="#c56c91"/></linearGradient></defs><ellipse cx="214" cy="388" rx="114" ry="14" fill="#a97a80" opacity=".18"/><g class="ear-left"><path d="M140 73 C132 24 178 8 188 56 L199 145 C201 171 153 166 149 137Z" fill="url(#fur)" stroke="#c6a0a2" stroke-width="3"/><path d="M157 69 C154 38 177 29 182 58 L188 134 C189 151 165 152 163 133Z" fill="#efb4bf"/></g><g class="ear-right"><path d="M237 56 C243 11 292 21 288 74 L276 150 C270 177 226 168 228 141Z" fill="url(#fur)" stroke="#c6a0a2" stroke-width="3"/><path d="M248 61 C251 33 274 35 273 65 L267 135 C265 153 242 150 244 132Z" fill="#efb4bf"/></g><ellipse cx="214" cy="185" rx="97" ry="94" fill="url(#fur)" stroke="#c9a4a2" stroke-width="3.2"/><ellipse cx="154" cy="185" rx="15" ry="23" fill="#40323d"/><ellipse cx="274" cy="185" rx="15" ry="23" fill="#40323d"/><ellipse cx="160" cy="178" rx="5" ry="8" fill="#fff"/><ellipse cx="280" cy="178" rx="5" ry="8" fill="#fff"/><ellipse cx="158" cy="224" rx="20" ry="12" fill="#ef9fad" opacity=".65"/><ellipse cx="272" cy="224" rx="20" ry="12" fill="#ef9fad" opacity=".65"/><path d="M208 204 Q215 196 222 204 Q215 213 208 204Z" fill="#b66b80"/><path d="M215 212 Q203 227 191 214 M216 212 Q228 227 240 214" fill="none" stroke="#916773" stroke-width="3.8" stroke-linecap="round"/><ellipse cx="214" cy="307" rx="103" ry="75" fill="url(#fur)" stroke="#c7a0a1" stroke-width="3"/><ellipse cx="214" cy="313" rx="64" ry="50" fill="#fff7ef" opacity=".86"/><ellipse cx="151" cy="360" rx="34" ry="24" fill="#fff4eb" stroke="#c7a0a1" stroke-width="3"/><ellipse cx="278" cy="360" rx="34" ry="24" fill="#fff4eb" stroke="#c7a0a1" stroke-width="3"/><circle cx="105" cy="282" r="20" fill="#fff4ee" stroke="#c7a0a1" stroke-width="3"/><circle cx="325" cy="282" r="20" fill="#fff4ee" stroke="#c7a0a1" stroke-width="3"/><g class="sign"><rect x="238" y="184" rx="18" ry="18" width="130" height="86" fill="url(#pink)" stroke="#9f5b79" stroke-width="3"/><rect x="250" y="196" rx="14" ry="14" width="106" height="62" fill="#fff8fb" opacity=".95"/><text x="303" y="229" text-anchor="middle" font-size="18" font-family="Instrument Serif, Georgia, serif" fill="#a84572">tocame</text><text x="303" y="248" text-anchor="middle" font-size="14" font-family="DM Sans, sans-serif" fill="#a27b88">el cartel</text></g><path d="M219 255 C237 242 260 241 278 255" fill="none" stroke="#caa1a2" stroke-width="6" stroke-linecap="round" opacity=".4"/></svg>`;
function render(){root.dataset.stage=stage;document.querySelectorAll('.steps i').forEach((el,i)=>el.classList.toggle('on',i===(['arrival','sign','letter'].indexOf(stage))));let html='';
if(stage==='arrival') html=`<section class="scene"><div class="kicker">DÍA 02 · SOLO PARA ${escapeHtml(gift.recipient.toUpperCase())}</div><h1>Sos<br><em>ridículamente</em><br>besable.</h1><p class="lead">Hoy viene alguien mucho más suave que Mimo: <b>Luna</b>, una conejita que no sabe disimular lo mucho que le gustás.</p><div class="bunny-wrap">${BUNNY}</div><div class="speech"><span class="line">“Hay gente linda…<br>y después estás vos.”</span><span class="caption">— Luna, especialista en sonrojarse</span></div><button class="action" data-action="start">Ver lo que traje <span>♡</span></button><p class="whisper">Te juro que este día es todavía más tierno.</p></section>`;
if(stage==='sign') html=`<section class="scene"><div class="kicker">REVELACIÓN COQUETA</div><h2>Un cartel<br><em>para vos.</em></h2><p class="lead">Tocalo para descubrir lo que Luna piensa cada vez que te mira.</p><div class="flipzone"><div class="sign-card ${signFlipped?'flipped':''}" id="signCard" role="button" tabindex="0" aria-label="Dar vuelta el cartel"><div class="sign-inner"><div class="sign-face front"><div class="stamp-hearts"><span>♥</span><span>✦</span><span>♥</span></div><div class="mini-pill">LUNA QUIERE DECIRTE ALGO</div><p class="sign-title">Este cartel tiene<br>una confesión.</p><p class="sign-copy">Tocá para darlo vuelta y descubrirla.</p></div><div class="sign-face back"><div class="mini-pill">CONFESIÓN ROMÁNTICA</div><div class="sign-reveal">Sos ridículamente besable.</div><div class="sign-sub">Y sí, es imposible no pensarlo.</div></div></div></div><p class="tapnote">${signFlipped?'Ahora abrí la cartita de Luna.':'Tocá el cartel para darlo vuelta.'}</p><button class="action" data-action="letter" id="openLunaLetter" hidden>Abrir mi cartita <span>↗</span></button></div></section>`;
if(stage==='letter') html=`<section class="scene"><div class="kicker">UNA CARTA SOLO PARA VOS</div><article class="letter"><div class="seal">♡</div><p class="label">DE ${escapeHtml(gift.sender.toUpperCase())} · PARA ${escapeHtml(gift.recipient.toUpperCase())}</p><h2>${escapeHtml(gift.letterTitle)}</h2>${(gift.letterParagraphs||[]).map(p=>`<p class="paragraph">${escapeHtml(p)}</p>`).join('')}<div class="rule">— ✦ —</div><div class="signature">${escapeHtml(gift.signature)}</div><p class="from">— ${escapeHtml(gift.sender)}</p></article><div class="tomorrow"><div class="done">✓</div><div><strong>Segunda sorpresa entregada.</strong><p>${escapeHtml(gift.tomorrow)}</p></div></div><button class="secondary" data-action="repeat">↺ Vivirla otra vez</button></section>`;
area.innerHTML=html;requestAnimationFrame(()=>window.scrollTo(0,0));
const sign=document.getElementById('signCard');if(sign){sign.addEventListener('click',flip);sign.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}})}
}
function flip(){
 if(signFlipped||stage!=='sign')return;
 signFlipped=true;vibrate([10,20,10]);chime([622,784,932]);
 const card=document.getElementById('signCard');
 card.classList.add('flipped');card.setAttribute('aria-label','Cartel revelado: sos ridículamente besable');
 const hint=document.querySelector('.tapnote');if(hint)hint.textContent='Luna ahora tiene una cartita para vos.';
 const button=document.getElementById('openLunaLetter');if(button){button.hidden=false;button.classList.add('letter-in');}
}
root.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const action=btn.dataset.action;if(action==='start'){stage='sign';signFlipped=false;vibrate(12);chime([620,830]);render()}if(action==='letter'){stage='letter';vibrate(16);chime([880,659,784]);render()}if(action==='repeat'){stage='arrival';signFlipped=false;render()}});
render();
</script>
</body>
</html>
