</style></head><body><div class="app" id="app"><span class="ambient amb1">✦</span><span class="ambient amb2">♥</span><span class="ambient amb3">✧</span><header class="top"><div class="brand">TE HICE ESTO <span>♥</span><small>UN POQUITO DE MÍ, CADA DÍA</small></div><div class="tools"><button type="button" id="sound" class="sound" aria-label="Activar sonidos" aria-pressed="false">♫ OFF</button><div class="daychip">DÍA <strong>07</strong> <em>/ 07</em></div></div></header><main id="stage" class="stage" aria-live="polite"></main><footer class="bottom"><span>HECHO CON AMOR, ESPECIALMENTE PARA VOS</span><div class="steps" id="steps"></div></footer></div><script>

let found=[false,false,false,false,false,false],roseOpened=false;
const memories=[
 {name:'Mimo',caption:'Un asalto de besos',phrase:'Tus besos me encantan.'},
 {name:'Luna',caption:'Un secreto besable',phrase:'Tu ternura me desarma.'},

function findMemory(n){if(scene!=='memories'||found[n])return;found[n]=true;buzz(12);chime([660,850]);render();}
function bloom(){if(roseOpened)return;roseOpened=true;buzz([20,40,20,35,30]);chime([523,659,784,1046,1318]);const s=document.querySelector('.rose-stage');if(s)s.classList.add('bloomed');const btn=document.getElementById('roseBtn');if(btn)btn.setAttribute('aria-label','Rosa abierta, mensaje revelado');const caption=document.getElementById('roseCaption');if(caption)caption.textContent='Esta rosa y todos mis días son para vos.';const next=document.getElementById('afterRose');
 if(next)setTimeout(()=>{if(scene==='rose'){next.hidden=false;next.classList.add('rose-cta-ready')}},reduce?50:1150);}
function render(){setSteps(['arrival','memories','rose','letter']);let html='';
if(scene==='arrival')html=`<section class="scene final-intro"><div class="kicker">DÍA 07 · EL ÚLTIMO CAPÍTULO DE ESTA SEMANA</div><h1>Siete días.<br><em>Una sola razón.</em></h1><p class="lead">Durante seis días te llegaron besos, abrazos, pistas, secretos y sonrisas. Hoy vinieron todos para decirte algo.</p><div class="characters">${icons.map((x,i)=>`<div class="character" style="--pos:${i}">${x}</div>`).join('')}</div><div class="bubble">“Todo esto fue una forma chiquita de decirte lo enorme que sos para mí.”<small>— Los seis cómplices de tu semana</small></div>${button('Abrir nuestro último capítulo ♡','start')}<p class="whisper">Quizás el final sea también un comienzo.</p></section>`;
if(scene==='memories')html=`<section class="scene"><div class="kicker">EL ÁLBUM DE UNA SEMANA ESPECIAL</div><h2>Cada día,<br><em>una razón más.</em></h2><p class="lead">Tocá los seis recuerdos para descubrir lo que estos animalitos guardaron sobre vos.</p><div class="memory-grid" role="group" aria-label="Seis recuerdos de la semana">${memories.map((m,i)=>`<button type="button" data-memory="${i}" class="memory" ${found[i]?'disabled':''} aria-label="${found[i]?'Recuerdo descubierto':'Descubrir recuerdo'} de ${m.name}"><span class="memory-ico">${icons[i]}</span><span class="memory-label">${m.name} · ${m.caption}</span>${found[i]?`<span class="memory-text">${m.phrase}</span>`:`<span class="memory-mark">TOCÁ PARA REVELAR ✦</span>`}</button>`).join('')}</div><div class="memory-meter"><span style="width:${found.filter(Boolean).length*100/6}%"></span></div><p class="memory-hint" role="status">${found.every(Boolean)?'Seis recuerdos, una sorpresa final.':'Descubriste '+found.filter(Boolean).length+' de 6 recuerdos.'}</p>${found.every(Boolean)?button('Ver lo que floreció por vos ↗','rose'):''}</section>`;
if(scene==='rose')html=`<section class="scene"><div class="kicker">UNA ROSA PARA TODOS LOS DÍAS QUE VIENEN</div><h2>Hay algo<br><em>que sigue creciendo.</em></h2><p class="lead">Tocá la rosa. Cada pétalo guarda una parte de todo lo que siento por vos.</p><div class="rose-stage ${roseOpened?'bloomed':''}"><div class="petal-rain" aria-hidden="true">${Array.from({length:12},(_,i)=>`<span style="--i:${i};--dir:${i*30}deg;animation-delay:${i*65}ms">♥</span>`).join('')}</div><button type="button" id="roseBtn" class="rose-button" aria-label="Abrir una rosa romántica">${rose}</button><span class="rose-shine">✧ ♡ ✦</span><span class="rose-promise" aria-hidden="true">Para todos nuestros días.</span></div><p id="roseCaption" class="rose-whisper">${roseOpened?'Esta rosa y todos mis días son para vos.':'Las cosas más lindas merecen florecer.'}</p><div id="afterRose" ${roseOpened?'':'hidden'}>${button('Abrir mi carta para siempre ♡','letter')}</div></section>`;
if(scene==='letter'){
 const images=(cfg.finalPhotos||[]).filter(u=>typeof u==='string'&&/^https:\/\//.test(u)).slice(0,4);
 const audio=typeof cfg.finalAudio==='string'&&/^https:\/\//.test(cfg.finalAudio)?cfg.finalAudio:'';
 html=`<section class="scene letter-scene"><div class="kicker">EL FINAL DE LA SEMANA · EL PRINCIPIO DE TODO</div><article class="paper final-paper"><div class="heart">♡</div><div class="to">DE ${esc(gift.sender.toUpperCase())} · PARA ${esc(gift.recipient.toUpperCase())}</div><h2>${esc(gift.heading||'Esto recién empieza.')}</h2>${(gift.paragraphs||[]).map(p=>`<p class="copy">${esc(p)}</p>`).join('')}<div class="rule">— ✦ —</div><p class="signature">${esc(gift.signature||'Te amo.')}</p><div class="from">— ${esc(gift.sender)}</div></article>${images.length?`<div class="photo-gallery">${images.map(url=>`<img src="${esc(url)}" alt="Recuerdo compartido" loading="lazy">`).join('')}</div>`:''}${audio?`<div class="final-audio"><strong>Una voz que es solo para vos</strong><audio controls preload="none" src="${esc(audio)}"></audio></div>`:''}<div class="final-badge"><div class="rose-mini">🌹</div><div><strong>7 días. Infinitas maneras de amarte.</strong><p>${esc(gift.tomorrow||'Te amo, hoy y todos los días.')}</p></div></div>${button('↺ Volver a vivir esta sorpresa','replay','outline')}</section>`;
}
area.innerHTML=html;requestAnimationFrame(()=>window.scrollTo(0,0));}
root.addEventListener('click',e=>{const mem=e.target.closest('[data-memory]');if(mem){findMemory(Number(mem.dataset.memory));return}const roseBtn=e.target.closest('#roseBtn');if(roseBtn){bloom();return}const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='start')go('memories');else if(a==='rose')go('rose');else if(a==='letter'){buzz(15);chime([880,1046,784]);go('letter')}else if(a==='replay'){roseOpened=false;found=[false,false,false,false,false,false];go('arrival')}});
