<path d="M374 99 C358 83 343 104 372 126 C399 103 386 81 374 99Z" fill="#d57b98" stroke="#fff4f4" stroke-width="2"/><path d="M76 195 C61 179 48 198 73 218 C97 200 90 179 76 195Z" fill="#eda9b8" opacity=".8"/><path d="M357 171 l5 13 14 3 -14 4 -5 15 -4 -15 -14 -4 14 -3Z" fill="#f0c9aa"/>
</svg>`;
function render(){
 root.dataset.stage=stage;
 const indexes=['arrival','heist','envelope','letter'];
 document.querySelectorAll('.steps i').forEach((dot,i)=>dot.classList.toggle('on',indexes[i]===stage));
 let markup='';
 if(stage==='arrival') markup=`<section class="scene arrival" aria-labelledby="opening-title"><div class="kicker">OPERACIÓN CONFIDENCIAL · PARA ${escapeHtml(gift.recipient.toUpperCase())}</div><h1 id="opening-title">${escapeHtml(gift.greetingFirst)}<br><em>${escapeHtml(gift.greetingSecond)}</em></h1><p class="lead">Hay un bandido muy tierno buscándote.</p><div class="mimo-wrap"><span class="spark left" aria-hidden="true">♥</span>${MIMO}<span class="spark right" aria-hidden="true">✦</span></div><div class="speech"><span class="line">“Dame todos tus besos.<br>Esto es un asalto de amor.”</span><span class="caption">— Mimo, bandido profesional de corazones</span></div><button type="button" class="action" data-action="start">Bueno, llevate mis besos <span>♡</span></button><p class="whisper">Tranquilo, Mimo solo dispara corazones.</p></section>`;
 if(stage==='heist') markup=`<section class="scene heist" aria-labelledby="heist-title"><div class="kicker">MISIÓN 01 · RECOLECTAR TERNURA</div><h2 id="heist-title">Se buscan<br><em>tres besitos.</em></h2><p class="lead">${escapeHtml(gift.demand)}</p><div class="playfield">${MIMO}<div class="kiss-options" role="group" aria-label="Tres besos para entregar">${[0,1,2].map(i=>`<button type="button" class="kiss" data-kiss="${i}" aria-label="${kisses[i]?'Beso '+(i+1)+' entregado':'Entregar beso '+(i+1)}" ${kisses[i]?'disabled':''}><span class="heart" aria-hidden="true">${kisses[i]?'✓':'♥'}</span><small>${kisses[i]?'ENVIADO':'BESITO'}</small></button>`).join('')}</div><div class="fly" id="flying"></div></div><div class="counter"><div class="counter-head"><span>BESITOS ENTREGADOS</span><strong>${kisses.filter(Boolean).length} <small>/ 03</small></strong></div><div class="counter-rail"><span style="width:${kisses.filter(Boolean).length*100/3}%"></span></div></div><p class="instructions" role="status">${kisses.every(Boolean)?'¡Misión cumplida! Mimo dejó una carta para vos…':'Tocá los tres corazones. Mimo los está esperando.'}</p></section>`;
 if(stage==='envelope') markup=`<section class="scene envelope-scene" aria-labelledby="envelope-title"><div class="kicker">ASALTO COMPLETADO CON ÉXITO</div><h2 id="envelope-title">Pero hay<br><em>algo más.</em></h2><p class="lead">Mimo vino a buscar tus besos…<br>y terminó dejándote una carta.</p><div class="envelope-area"><span class="env-glint a" aria-hidden="true">✧</span><div class="envelope" aria-label="Sobre premium rosado con carta interior y sello de lacre"><div class="back"></div><div class="paper-in"><div class="paper-blush" aria-hidden="true"></div><span>PARA ${escapeHtml(gift.recipient.toUpperCase())}</span><b>♡</b></div><div class="topfold"></div><div class="front"></div><div class="side-shadow" aria-hidden="true"></div><div class="wax"><span class="seal-dot" aria-hidden="true"></span>♡</div></div><span class="env-glint b" aria-hidden="true">✦</span></div><p class="handwritten">“Esto sí es muy en serio…”</p><button type="button" class="action" data-action="letter">Abrir mi cartita <span>↗</span></button><p class="whisper">Hecha con amor, especialmente para vos.</p></section>`;
 if(stage==='letter') markup=`<section class="scene letter-scene" aria-labelledby="letter-title"><div class="kicker">UN MENSAJE QUE ES SOLO TUYO</div><article class="letter"><div class="seal" aria-hidden="true">♡</div><p class="label">DE ${escapeHtml(gift.sender.toUpperCase())} · PARA ${escapeHtml(gift.recipient.toUpperCase())}</p><h2 id="letter-title">${escapeHtml(gift.letterTitle)}</h2>${gift.paragraphs.map(p=>`<p class="paragraph">${escapeHtml(p)}</p>`).join('')}<div class="rule">— ✦ —</div><div class="signature">${escapeHtml(gift.signature)}</div><p class="from">— ${escapeHtml(gift.sender)}</p></article><div class="tomorrow"><div class="done">✓</div><div><strong>Primera sorpresa entregada.</strong><p>${escapeHtml(gift.tomorrow)}</p></div></div><button type="button" class="repeat" data-action="repeat">↺ Vivirla otra vez</button></section>`;
 area.innerHTML=markup;
 // Reset the scene viewport without blocking natural scrolling for long letters.
 requestAnimationFrame(()=>{window.scrollTo({top:0,left:0,behavior:'instant'})});
}
root.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button||!root.contains(button))return;
 const action=button.dataset.action;
 if(action==='start'){vibrate(12);chime([620,830]);stage='heist';render();return}
 if(button.hasAttribute('data-kiss')){
  const n=Number(button.dataset.kiss);if(!Number.isInteger(n)||n<0||n>2||stage!=='heist'||kisses[n])return;
  kisses[n]=true;vibrate([12,22,12]);chime(kisses.every(Boolean)?[523,659,784,1046]:[620,830]);
  const count=kisses.filter(Boolean).length;
  const rail=root.querySelector('.counter-rail span');if(rail)rail.style.width=count*100/3+'%';
  const countText=root.querySelector('.counter-head strong');if(countText)countText.innerHTML=count+' <small>/ 03</small>';
  button.disabled=true;button.querySelector('.heart').textContent='✓';button.querySelector('small').textContent='ENVIADO';button.setAttribute('aria-label','Beso '+(n+1)+' entregado');
  const flying=document.getElementById('flying');if(flying)flying.innerHTML='<span>♥</span><span>♥</span><span>✦</span>';
  if(kisses.every(Boolean)){
   root.querySelector('.instructions').textContent='¡Misión cumplida! Mimo dejó una carta para vos…';
   if(advanceTimer)clearTimeout(advanceTimer);
   advanceTimer=setTimeout(()=>{stage='envelope';render()},window.matchMedia('(prefers-reduced-motion:reduce)').matches?180:1100);
  }
  return;
 }
 if(action==='letter'){
  if(stage!=='envelope'||button.disabled)return;
  button.disabled=true;button.setAttribute('aria-busy','true');
  root.querySelector('.envelope')?.classList.add('opening');
  root.querySelector('.envelope-area')?.classList.add('opening');
  vibrate(16);chime([880,659,784]);
  setTimeout(()=>{stage='letter';completed=true;render()},window.matchMedia('(prefers-reduced-motion:reduce)').matches?100:1050);
  return;
 }
 if(action==='repeat'){if(advanceTimer)clearTimeout(advanceTimer);kisses=[false,false,false];stage='arrival';render();return}
});
render();
</script>
</body></html>
