 cx=\"257\" cy=\"165\" rx=\"13\" ry=\"19\" fill=\"#4c3540\"/><circle cx=\"173\" cy=\"159\" r=\"5\" fill=\"white\"/><circle cx=\"261\" cy=\"159\" r=\"5\" fill=\"white\"/>\n <ellipse cx=\"148\" cy=\"202\" rx=\"24\" ry=\"13\" fill=\"#f2a7ae\" opacity=\".65\"/><ellipse cx=\"278\" cy=\"202\" rx=\"24\" ry=\"13\" fill=\"#f2a7ae\" opacity=\".65\"/>\n <ellipse cx=\"214\" cy=\"203\" rx=\"39\" ry=\"29\" fill=\"#fff0e3\"/><path d=\"M201 192 Q214 181 226 192 Q215 207 201 192\" fill=\"#8c5863\"/><path d=\"M214 201 Q202 218 191 205 M214 201 Q226 218 238 205\" fill=\"none\" stroke=\"#9c6b6b\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n <path d=\"M131 247 Q214 271 296 245 L283 276 Q210 299 144 273Z\" fill=\"url(#ribbon)\" stroke=\"#b76c83\" stroke-width=\"3\"/><path d=\"M246 274 L273 333 L291 317 L283 269Z\" fill=\"#d9869a\" stroke=\"#b76c83\" stroke-width=\"2\"/>\n <path d=\"M206 301 C189 281 167 300 188 317 L214 339 L239 316 C260 297 239 281 218 301Z\" fill=\"#e18da7\" stroke=\"#fff0eb\" stroke-width=\"3\"/>\n <path d=\"M346 75 l4 15 15 4 -15 4 -4 15 -4 -15 -15 -4 15 -4Z\" fill=\"#db9eaf\"/>\n </svg>";
let touching=false,progress=0,lastTick=0,raf=0;
function stopHold(){touching=false;cancelAnimationFrame(raf);const h=document.getElementById('hug');if(h)h.classList.remove('pressing');}
function hugComplete(){stopHold();progress=100;buzz([20,30,20,30,30]);chime([523,659,784,988]);go('warm');}
function tick(now){if(!touching)return;if(!lastTick)lastTick=now;const delta=now-lastTick;lastTick=now;progress=Math.min(100,progress+delta/24);const meter=document.querySelector('.hug-meter span');if(meter)meter.style.width=progress+'%';const b=document.getElementById('hug');if(b)b.style.setProperty('--hug-progress',progress/100);if(progress>=100){hugComplete();return;}raf=requestAnimationFrame(tick)}
function render(){setSteps(['arrival','hug','warm','letter']);let html='';
if(scene==='arrival')html=`<section class="scene"><div class="kicker">DÍA 04 · UNA URGENCIA DE AMOR</div><h1>Abrazo<br><em>de emergencia.</em></h1><p class="lead">Bubi, el osito más cariñoso del mundo, vino a entregarte algo que no cabe en un mensaje.</p><div class="bear-stage">${bear}</div><div class="bubble">“Necesito abrazarte. Con urgencia.”<small>— Bubi, servicio de abrazos a domicilio</small></div>${button('Recibir mi abrazo ♡','begin')}<p class="whisper">Se recomienda cerrar los ojos por un segundo.</p></section>`;
if(scene==='hug')html=`<section class="scene"><div class="kicker">MISIÓN · ENTREGAR CALORCITO</div><h2>Este abrazo<br><em>es para vos.</em></h2><p class="lead">Mantené presionado el corazón para que Bubi te envuelva en un abrazo largo.</p><div class="bear-stage ${touching?'hugged':''}" id="bearStage"><div class="hughalo"></div>${bear}</div><div class="hug-stage"><button id="hug" class="hug-button" type="button" aria-label="Mantener para recibir un abrazo"><span class="symbol">♡</span><span class="caption">ABRAZAME</span></button><div class="hug-meter"><span style="width:${progress}%"></span></div><p class="hug-confirm" role="status">${progress>0?'Seguí un poquito más…':'Mantené presionado durante dos segundos.'}</p><button type="button" class="softskip" data-action="accessibleHug">Prefiero recibirlo con un toque</button></div></section>`;
if(scene==='warm')html=`<section class="scene"><div class="kicker">ABRAZO ENTREGADO · CALORCITO ACTIVADO</div><h2>Si estuvieras<br><em>acá conmigo…</em></h2><p class="lead">Bubi dice que lo más lindo de un abrazo no son los brazos. Es con quién lo compartís.</p><div class="warm-orbs">${bear}</div><p class="warm-message">“Te abrazaría hasta que se te olvidara el día difícil.”</p>${button('Abrir lo que te quiero decir ↗','letter')}</section>`;
if(scene==='letter')html=letter();
area.innerHTML=html;requestAnimationFrame(()=>window.scrollTo(0,0));
if(scene==='hug'){const b=document.getElementById('hug');b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touching=true;lastTick=0;b.classList.add('pressing');document.getElementById('bearStage').classList.add('hugged');raf=requestAnimationFrame(tick);});b.addEventListener('pointerup',stopHold);b.addEventListener('pointercancel',stopHold);b.addEventListener('lostpointercapture',stopHold);b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();hugComplete()}});}
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(action==='begin'){buzz(12);chime([610,780]);go('hug')}else if(action==='accessibleHug')hugComplete();else if(action==='letter'){buzz(15);chime([659,784,988]);go('letter')}else if(action==='replay'){progress=0;lastTick=0;go('arrival')}});
render();
</script></body></html>
