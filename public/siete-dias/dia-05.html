</style></head><body><div class="app" id="app"><span class="ambient amb1">✦</span><span class="ambient amb2">♥</span><span class="ambient amb3">✧</span><header class="top"><div class="brand">TE HICE ESTO <span>♥</span><small>UN POQUITO DE MÍ, CADA DÍA</small></div><div class="tools"><button type="button" id="sound" class="sound" aria-label="Activar sonidos" aria-pressed="false">♫ OFF</button><div class="daychip">DÍA <strong>05</strong> <em>/ 07</em></div></div></header><main id="stage" class="stage" aria-live="polite"></main><footer class="bottom"><span>HECHO CON AMOR, ESPECIALMENTE PARA VOS</span><div class="steps" id="steps"></div></footer></div><script>

function chime(notes){if(!soundOn||!window.AudioContext)return;try{const a=new AudioContext();if(a.state==='suspended')void a.resume();const t=a.currentTime;notes.forEach((hz,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(hz,t+i*.095);g.gain.setValueAtTime(.0001,t+i*.095);g.gain.exponentialRampToValueAtTime(.02,t+i*.095+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.095+.29);o.connect(g).connect(a.destination);o.start(t+i*.095);o.stop(t+i*.095+.3)});setTimeout(()=>a.close(),900)}catch(e){}}

function setSteps(list){document.getElementById('steps').innerHTML=list.map(x=>`<i class="${x===scene?'on':''}"></i>`).join('')}

const cat="<svg class=\"illustration\" viewBox=\"0 0 430 410\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Duque, un gatito de esmoquin con moño y pase de besos\"><defs><radialGradient id=\"fur\" cx=\"36%\" cy=\"25%\" r=\"80%\"><stop stop-color=\"#fffdf7\"/><stop offset=\".5\" stop-color=\"#f6e2d4\"/><stop offset=\"1\" stop-color=\"#b9a3a9\"/></radialGradient><linearGradient id=\"ribbon\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#ffcfde\"/><stop offset=\"1\" stop-color=\"#aa748e\"/></linearGradient></defs><ellipse cx=\"215\" cy=\"387\" rx=\"110\" ry=\"15\" fill=\"#b78f96\" opacity=\".18\"/>\n <g class=\"tail\"><path d=\"M301 319 Q390 314 361 241 Q346 219 331 237\" fill=\"none\" stroke=\"#6a5265\" stroke-width=\"38\" stroke-linecap=\"round\"/><path d=\"M301 319 Q390 314 361 241 Q346 219 331 237\" fill=\"none\" stroke=\"#e7d0cd\" stroke-width=\"31\" stroke-linecap=\"round\"/></g>\n <ellipse cx=\"212\" cy=\"302\" rx=\"99\" ry=\"84\" fill=\"#5c4a5d\" stroke=\"#473a4a\" stroke-width=\"4\"/><path d=\"M168 258 Q211 236 257 258 L237 350 Q211 370 186 350Z\" fill=\"#fff6ed\"/>\n <ellipse cx=\"158\" cy=\"367\" rx=\"36\" ry=\"24\" fill=\"url(#fur)\" stroke=\"#a5919d\" stroke-width=\"3\"/><ellipse cx=\"268\" cy=\"367\" rx=\"36\" ry=\"24\" fill=\"url(#fur)\" stroke=\"#a5919d\" stroke-width=\"3\"/>\n <path d=\"M120 145 L119 45 Q120 32 136 46 L184 88Z\" fill=\"url(#fur)\" stroke=\"#a5919d\" stroke-width=\"4\"/><path d=\"M243 88 L308 42 Q321 36 318 57 L310 156Z\" fill=\"url(#fur)\" stroke=\"#a5919d\" stroke-width=\"4\"/>\n <path d=\"M137 96 L136 62 L166 94Z\" fill=\"#e6a4b5\"/><path d=\"M267 90 L300 65 L298 115Z\" fill=\"#e6a4b5\"/>\n <ellipse cx=\"214\" cy=\"175\" rx=\"112\" ry=\"105\" fill=\"url(#fur)\" stroke=\"#a5919d\" stroke-width=\"4\"/>\n <path d=\"M122 174 Q146 106 200 112 Q207 153 180 168Z\" fill=\"#6a5666\" opacity=\".96\"/><path d=\"M229 115 Q278 96 300 156 L271 170 Q253 149 229 115Z\" fill=\"#6a5666\"/>\n <ellipse cx=\"171\" cy=\"183\" rx=\"13\" ry=\"20\" fill=\"#3a303d\"/><ellipse cx=\"259\" cy=\"183\" rx=\"13\" ry=\"20\" fill=\"#3a303d\"/><circle cx=\"176\" cy=\"174\" r=\"5\" fill=\"white\"/><circle cx=\"263\" cy=\"174\" r=\"5\" fill=\"white\"/>\n <ellipse cx=\"154\" cy=\"214\" rx=\"22\" ry=\"12\" fill=\"#eea4b3\" opacity=\".7\"/><ellipse cx=\"277\" cy=\"214\" rx=\"22\" ry=\"12\" fill=\"#eea4b3\" opacity=\".7\"/>\n <path d=\"M203 206 Q213 198 223 206 Q213 218 203 206Z\" fill=\"#b7788c\"/><path d=\"M213 216 Q198 233 188 218 M213 216 Q228 234 241 217\" fill=\"none\" stroke=\"#90717d\" stroke-width=\"3.8\" stroke-linecap=\"round\"/>\n <path d=\"M123 216 L94 208 M124 228 L95 232 M302 214 L332 207 M302 228 L334 232\" stroke=\"#ad98a0\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n <path d=\"M178 278 L213 294 L190 310Z M249 278 L213 294 L236 310Z\" fill=\"url(#ribbon)\" stroke=\"#c08ba1\" stroke-width=\"2\"/><circle cx=\"213\" cy=\"294\" r=\"10\" fill=\"#e3afc4\"/>\n <g transform=\"rotate(-14 305 321)\"><rect x=\"264\" y=\"275\" width=\"105\" height=\"71\" rx=\"10\" fill=\"#f6e8d7\" stroke=\"#b69383\" stroke-width=\"3\"/><rect x=\"271\" y=\"281\" width=\"91\" height=\"59\" rx=\"7\" fill=\"none\" stroke=\"#d9c5ad\"/><text x=\"317\" y=\"300\" text-anchor=\"middle\" font-size=\"9\" fill=\"#a17f83\" font-family=\"Georgia\">PASE VIP</text><path d=\"M319 319 C308 308 300 320 319 331 C338 318 329 308 319 319Z\" fill=\"#ca7b94\"/></g>\n <ellipse cx=\"265\" cy=\"324\" rx=\"31\" ry=\"25\" fill=\"url(#fur)\" stroke=\"#b4a0a8\" stroke-width=\"3\"/>\n </svg>";
let unwrapped=false,dragging=false,dragX=0,pointerStart=0;
function unwrap(){
 if(unwrapped)return;unwrapped=true;buzz([12,24,15]);chime([523,659,784,1046]);
 const caseEl=document.querySelector('.ticket-case');if(caseEl)caseEl.classList.add('unwrapped');
 const knob=document.getElementById('knob');if(knob)knob.setAttribute('aria-valuenow','100');
 const hint=document.querySelector('.ticket-hint');if(hint)hint.textContent='El pase es tuyo. ♡';
 setTimeout(()=>go('ticket'),reduce?120:760);
}
function render(){setSteps(['arrival','slide','ticket','letter']);let html='';
if(scene==='arrival')html=`<section class="scene"><div class="kicker">DÍA 05 · UNA CONFESIÓN MUY ELEGANTE</div><h1>Qué privilegio<br><em>tener tus besos.</em></h1><p class="lead">Duque llegó de moño, con modales de gala y una invitación exclusiva.</p><div class="cat-stage">${cat}</div><div class="bubble">“De todas las cosas lindas, tus besos son mi lujo favorito.”<small>— Duque, distinguido catador de cariño</small></div>${button('Ver mi invitación dorada ♡','start')}</section>`;
if(scene==='slide')html=`<section class="scene"><div class="kicker">INVITACIÓN PERSONAL · ACCESO EXCLUSIVO</div><h2>Un pase<br><em>solo para vos.</em></h2><p class="lead">Deslizá la cinta de seda para descubrir tu privilegio. Sin apuro.</p><div class="ticket-case ${unwrapped?'unwrapped':''}"><div class="ticket-halo"></div><div class="ticket-frame"><div class="ticket-face"><div class="ticket-kicker">TE HICE ESTO · CLUB DEL AMOR</div><div class="ticket-number">VIP ♡</div><div class="ticket-sub">UNA PERSONA · INFINITOS BESOS</div></div><div class="ticket-ribbon"></div></div></div><div id="slider" class="slider-shell" role="group" aria-label="Deslizar cinta del regalo"><div id="knob" role="slider" tabindex="0" aria-label="Deslizar la cinta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="slider-knob">➜</div><div class="slider-copy">Deslizá para abrir el regalo</div></div><p class="ticket-hint">Podés deslizar o tocar el botón de abajo.</p><button type="button" class="outline" data-action="unwrap">Abrir sin deslizar</button></section>`;
if(scene==='ticket')html=`<section class="scene"><div class="kicker">CINTA ABIERTA · INVITACIÓN REVELADA</div><h2>Mi lugar<br><em>favorito en el mundo.</em></h2><p class="lead">Duque certifica este privilegio como único, permanente e intransferible.</p><div class="unwrapped-ticket"><div class="tiny">PASE VIP · VÁLIDO PARA SIEMPRE</div><div class="big">Tus besos.</div><p>Mi pequeña fortuna favorita.</p></div>${button('Leer por qué es tan especial ↗','letter')}</section>`;
if(scene==='letter')html=letter();
area.innerHTML=html;requestAnimationFrame(()=>window.scrollTo(0,0));
if(scene==='slide'){
 const slider=document.getElementById('slider'),knob=document.getElementById('knob');
 const max=()=>Math.max(1,slider.clientWidth-knob.clientWidth-20);
 function onMove(e){if(!dragging)return;dragX=Math.max(0,Math.min(max(),e.clientX-pointerStart));knob.style.setProperty('--drag',dragX+'px');knob.setAttribute('aria-valuenow',Math.round(dragX/max()*100));if(dragX/max()>.84){dragging=false;unwrap()}}
 knob.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;pointerStart=e.clientX-dragX;knob.setPointerCapture(e.pointerId);slider.classList.add('dragging')});
 knob.addEventListener('pointermove',onMove);knob.addEventListener('pointerup',()=>{dragging=false;slider.classList.remove('dragging');if(!unwrapped&&dragX/max()<=.84){dragX=0;knob.style.setProperty('--drag','0px');knob.setAttribute('aria-valuenow','0')}});knob.addEventListener('pointercancel',()=>{dragging=false;dragX=0;knob.style.setProperty('--drag','0px')});
 knob.addEventListener('keydown',e=>{if(['Enter',' ','End'].includes(e.key)){e.preventDefault();unwrap()}else if(['ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();dragX=Math.min(max(),dragX+max()/4);knob.style.setProperty('--drag',dragX+'px');knob.setAttribute('aria-valuenow',Math.round(dragX/max()*100));if(dragX/max()>.84)unwrap()}});
 }
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='start')go('slide');else if(a==='unwrap')unwrap();else if(a==='letter'){buzz(15);chime([659,784,988]);go('letter')}else if(a==='replay'){unwrapped=false;dragX=0;go('arrival')}});
render();
</script></body></html>
