function render(){setSteps(['arrival','scratch','revealed','letter']);let html='';
if(scene==='arrival')html=`<section class="scene"><div class="kicker">DÍA 06 · ARCHIVO DE COSAS QUE NO DIJE</div><h1>Hay algo<br><em>que confesarte…</em></h1><p class="lead">Pipo es un hámster tímido. Guardó una confesión en su diario, pero no se anima a decirla en voz alta.</p><div class="hamster-stage">${hamster}</div><div class="bubble">“¿Prometés no reírte de lo enamorado que estoy?”<small>— Pipo, guardián de secretos muy tiernos</small></div>${button('Prometo guardar tu secreto ♡','start')}</section>`;
if(scene==='scratch')html=`<section class="scene"><div class="kicker">CONFESIÓN Nº 06 · SOLO PARA VOS</div><h2>Un secreto<br><em>que no se borra.</em></h2><p class="lead">Deslizá tu dedo sobre la tinta perlada para descubrir lo que Pipo escondió.</p><div class="secret-board"><div class="secret-label">DIARIO SECRETO · PÁGINA 06</div><div class="scratch-box"><div class="scratch-reveal"><strong>Me seguís gustando muchísimo.</strong><span>Incluso más de lo que imaginás. ♡</span></div><canvas id="scratchCanvas" role="img" aria-label="Zona para raspar y revelar una confesión"></canvas></div><p class="scratch-hint">Raspá con el dedo o el mouse. No hay apuro.</p></div><button type="button" class="outline" data-action="reveal">Revelar sin raspar</button><div class="secret-hint" id="scratch-after" hidden><span>♥</span> Confesión descubierta. Ahora hay algo más… <button data-action="continue" class="action" style="min-width:auto;min-height:43px;padding:10px 15px">Continuar ↗</button></div></section>`;
if(scene==='revealed')html=`<section class="scene"><div class="kicker">CONFESIÓN REVELADA</div><h2>Me seguís<br><em>gustando muchísimo.</em></h2><p class="lead">Desde el primer día y en cada uno de los días que vinieron después.</p><div class="hamster-stage">${hamster}</div><p class="scratch-done">“Y no pienso disimularlo.”</p>${button('Leer mi confesión completa ↗','letter')}</section>`;
if(scene==='letter')html=letter();area.innerHTML=html;requestAnimationFrame(()=>window.scrollTo(0,0));if(scene==='scratch')requestAnimationFrame(setupScratch);
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='start'){scratchFinished=false;strokes=0;go('scratch')}else if(a==='reveal')revealScratch();else if(a==='continue'&&scratchFinished)go('revealed');else if(a==='letter'){buzz(15);chime([659,784,988]);go('letter')}else if(a==='replay')go('arrival')});render();
</script></body></html>
