name: Restore archived TeHiceEsto premium models
on:
  push:
    branches: [restore-premium-v5-original]
    paths:
      - ".github/workflows/restore-premium-v5.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Copy frozen premium-v5 engine and original assets
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/ProtectorRudo/viralio.git /tmp/viralio-premium-archive
          SRC=/tmp/viralio-premium-archive/src/app/tehiceesto
          mkdir -p components/legacy-v5
          cp "$SRC"/template-v5/* components/legacy-v5/
          cp "$SRC"/FriendshipPhotoPuzzle.{tsx,css} components/legacy-v5/
          sed -i 's@from "../FriendshipPhotoPuzzle"@from "./FriendshipPhotoPuzzle"@' components/legacy-v5/FriendshipScenes.tsx
          for n in tehiceesto-premium-v1 tehiceesto-live tehiceesto-demo-viewport tehiceesto-birthday tehiceesto-hijos-live tehiceesto-mama-voices-fix tehiceesto-amistad-live tehiceesto-customer-media tehiceesto-friendship-premium; do
            cp "$SRC/$n.css" "components/legacy-v5/$n.css"
          done
          mkdir -p public/tehiceesto/pareja/finale public/viralio-3d/materials
          cp /tmp/viralio-premium-archive/public/tehiceesto/pareja/finale/rose-*.webp public/tehiceesto/pareja/finale/
          cp /tmp/viralio-premium-archive/public/tehiceesto/{everyday-cinematic-hd.avif,everyday-cinematic.webp,umbral-cinematico.webp,birthday-letter-botanical.svg} public/tehiceesto/
          cp /tmp/viralio-premium-archive/public/viralio-3d/materials/fabric_leather_01-color.webp public/viralio-3d/materials/
          cat > components/legacy-v5/legacy-styles.css <<'CSS'
          @import "./tehiceesto-premium-v1.css";
          @import "./tehiceesto-live.css";
          @import "./tehiceesto-demo-viewport.css";
          @import "./tehiceesto-birthday.css";
          @import "./tehiceesto-hijos-live.css";
          @import "./tehiceesto-mama-voices-fix.css";
          @import "./tehiceesto-amistad-live.css";
          @import "./tehiceesto-customer-media.css";
          @import "./tehiceesto-friendship-premium.css";
          @import "./model-v5.css";
          CSS
          python3 - <<'PY'
          from pathlib import Path
          p=Path("components/legacy-v5/ExperienceEngine.tsx")
          s=p.read_text()
          s=s.replace('import PairRoseFinale from "./PairRoseFinaleCinematic";','import PairRoseFinale from "./PairRoseFinaleCinematic";\nimport PremiumOpeningIntro from "../PremiumOpeningIntro";\nimport {getExperience as getCurrentExperience} from "@/data/experiences";')
          a=s.index('        if(experience.slug==="pareja")return <CoupleGiftIntro')
          b=s.index('        if(experience.slug==="hijos")return',a)
          s=s[:a]+'''        if(experience.slug==="pareja"){
            const base=getCurrentExperience("pareja");
            return base?<div className="experience-shell"><PremiumOpeningIntro experience={{...base,demoRecipient:experience.demoRecipient,demoGiver:experience.demoGiver,opening:experience.opening}} onContinue={next}/></div>:null;
          }
          '''+s[b:]
          p.write_text(s)
          Path("components/LegacyPremiumExperience.tsx").write_text('''"use client";
          import {useMemo,useState} from "react";
          import type {Experience as CurrentExperience} from "@/data/experiences";
          import type {SceneTextOverrides} from "@/data/scene-text";
          import PremiumOpeningIntro from "./PremiumOpeningIntro";
          import ArchivedPremiumEngine from "./legacy-v5/ExperienceEngine";
          import {getExperience as getArchivedExperience} from "./legacy-v5/data";
          import "./legacy-v5/legacy-styles.css";
          type Media={url:string;caption?:string;fit?:"cover"|"contain";position?:"center"|"top"|"bottom"|"left"|"right"};
          type Props={experience:CurrentExperience;letterText?:string;photoUrls?:string[];photoMedia?:Media[];audioMedia?:Media[];soundtrackMedia?:Media;videoMedia?:Media[];storyContext?:{keyDate?:string;anecdote?:string};sceneTextOverrides?:SceneTextOverrides;customerGift?:boolean};
          export const restoredPremiumSlugs=new Set(["pareja","cumpleanos","hijos","abuelos","aniversario","propuesta","mama","papa","amistad"]);
          export default function LegacyPremiumExperience(props:Props){
            const {experience}=props;const[opened,setOpened]=useState(false);
            const source=useMemo(()=>getArchivedExperience(experience.slug),[experience.slug]);
            if(!source)return null;
            const model={...source,demoRecipient:experience.demoRecipient,demoGiver:experience.demoGiver,opening:experience.opening,closing:experience.closing,accent:experience.accent};
            if(!opened&&experience.slug!=="pareja")return <div className="experience-shell legacy-floral-prologue"><PremiumOpeningIntro experience={experience} onContinue={()=>setOpened(true)}/></div>;
            const photoMedia=(props.photoMedia?.length?props.photoMedia:props.photoUrls?.map(url=>({url})))||[];
            return <div className="thi-root legacy-premium-renderer"><ArchivedPremiumEngine experience={model} letterText={props.letterText} photoMedia={photoMedia} audioMedia={props.audioMedia} soundtrackMedia={props.soundtrackMedia} videoMedia={props.videoMedia} storyContext={props.storyContext} sceneTextOverrides={props.sceneTextOverrides} customerGift={props.customerGift||false}/></div>;
          }
          ''')
          engine=Path("components/ExperienceEngine.tsx");src=engine.read_text()
          src=src.replace('import SecretExperience from "./SecretExperience";','import SecretExperience from "./SecretExperience";\nimport LegacyPremiumExperience,{restoredPremiumSlugs} from "./LegacyPremiumExperience";')
          src=src.replace('  sceneTextOverrides?: SceneTextOverrides;\n};','  sceneTextOverrides?: SceneTextOverrides;\n  customerGift?: boolean;\n};',1)
          src=src.replace('  if (props.experience.slug === "secreto") return <SecretExperience {...props} />;','  if (restoredPremiumSlugs.has(props.experience.slug)) return <LegacyPremiumExperience {...props} />;\n  if (props.experience.slug === "secreto") return <SecretExperience {...props} />;')
          engine.write_text(src)
          for fn in ["app/r/[code]/page.tsx","app/admin/gifts/[code]/preview/page.tsx"]:
            p=Path(fn);s=p.read_text()
            if "customerGift" not in s:s=s.replace("<ExperienceEngine\n","<ExperienceEngine\n          customerGift\n",1)
            p.write_text(s)
          PY
      - name: Verify restoration builds
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Commit complete archived model to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-premium-v5.yml
          git add components/ExperienceEngine.tsx components/LegacyPremiumExperience.tsx components/legacy-v5 app/r/'[code]'/page.tsx app/admin/gifts/'[code]'/preview/page.tsx public/tehiceesto public/viralio-3d .github/workflows/restore-premium-v5.yml
          git commit -m "restore: cinematic premium-v5 models and rose finale, keeping floral opening"
          git push origin HEAD:refs/heads/restore-premium-v5-original
