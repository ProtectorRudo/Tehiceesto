name: Deploy affiliate system once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-once-affiliate.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Inspect deployment URL (may require Vercel Authentication)
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          code="$(curl -sSL --max-time 30 -o /tmp/version.json -w '%{http_code}' "$DEPLOYMENT_URL/api/version" || true)"
          if [ "$code" = "200" ]; then
            cat /tmp/version.json
          elif [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "Deployment URL is protected; verifying production alias instead."
          else
            echo "::warning::Deployment URL returned HTTP $code; validating via production alias."
          fi

      - name: Verify production alias
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in {1..30}; do
            body="$(curl -fsSL --max-time 30 https://tehiceesto.com/api/version || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q "$EXPECTED_SHA"; then
              echo "Production alias points to expected commit."
              exit 0
            fi
            sleep 5
          done
          echo "::error::tehiceesto.com does not expose expected commit $EXPECTED_SHA"
          exit 1

      - name: Confirm influencer and checkout routes on published domain
        run: |
          for path in /afiliados /admin/affiliates /comprar/pareja; do
            status="$(curl -sSL --max-time 30 -o /dev/null -w '%{http_code}' "https://tehiceesto.com$path")"
            test "$status" = "200" || { echo "::error::$path HTTP $status"; exit 1; }
          done
          # The checkout endpoint must exist but reject GET: no test order is created.
          code="$(curl -sSL --max-time 30 -o /dev/null -w '%{http_code}' https://tehiceesto.com/api/checkout)"
          test "$code" = "405" || { echo "::error::Checkout API missing or unsafe: HTTP $code"; exit 1; }
          echo "Affiliate management, referral-aware checkout and quick purchase routes are published."
