name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production deploy is intentionally blocked until the three Vercel secrets are configured."
            exit 1
          fi

      - name: Reject the wrong project and an old commit
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$VERCEL_PROJECT_ID" = "prj_1VcOY4n08AEPMH9ltaRLBRJZstKt" || {
            echo "::error::Refusing to deploy into any other project (especially shared Viralio)."
            exit 1
          }
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$EXPECTED_SHA" || {
            echo "::error::Main advanced while preparing release: refuse stale deployment."
            exit 1
          }

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce permanent product and purchase routes
        run: |
          node --test tests/*.test.mjs
          node scripts/release-contract.mjs --static

      - name: Pin artifact to the checkout SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/create-release-manifest.mjs "$EXPECTED_SHA"

      - name: Install pinned Vercel CLI
        run: npm install --global --ignore-scripts vercel@65.10.0

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod

      - name: Confirm main still matches the artifact before staging
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$EXPECTED_SHA" || {
            echo "::error::New code was merged. Do not ship an earlier artifact."
            exit 1
          }

      - name: Stage production artifact WITHOUT changing customer domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(vercel deploy --prebuilt --prod --skip-domain --yes)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Smoke test exact staged artifact before any promotion
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOYMENT_URL"
          for i in {1..12}; do
            if node scripts/release-contract.mjs --live "$DEPLOYMENT_URL" "$EXPECTED_SHA"; then
              echo "Staged release passed the complete customer-route contract."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Staged release failed. The public site has NOT been modified."
          exit 1

      - name: Promote the SAME verified deployment (no rebuild)
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes

      - name: Verify both public destinations serve the exact release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in {1..18}; do
            if node scripts/release-contract.mjs --live "https://tehiceesto.vercel.app" "$EXPECTED_SHA" &&
               node scripts/release-contract.mjs --live "https://tehiceesto.com" "$EXPECTED_SHA"; then
              echo "Both customer origins are serving and passing the exact same release."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production aliases disagree with the approved release. ROLLBACK REQUIRED."
          exit 1

      - name: Publish a failed-release incident summary
        if: failure()
        run: |
          echo "::error::Release failed a required check. Inspect failed step and previous READY release; do not claim publication success."
