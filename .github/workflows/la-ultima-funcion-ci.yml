name: La Ultima Funcion - build y navegacion
on:
  push:
    branches: [juego-la-ultima-funcion]
    paths:
      - 'games/la-ultima-funcion/**'
      - '.github/workflows/la-ultima-funcion-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: games/la-ultima-funcion
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar TypeScript y Vite
        run: npm run build
      - name: Preparar navegadores
        run: npx playwright install --with-deps chromium
      - name: Probar Android vertical y escritorio
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Guardar resultados si hay fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teatro-pruebas
          path: games/la-ultima-funcion/test-results
