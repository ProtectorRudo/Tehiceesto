name: La Ultima Funcion - build y navegacion
on:
  push:
    branches: [juego-la-ultima-funcion]
    paths:
      - 'games/la-ultima-funcion/**'
      - '.github/workflows/la-ultima-funcion-ci.yml'
  workflow_dispatch:
concurrency:
  group: ultima-funcion-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prueba-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: games/la-ultima-funcion
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar TypeScript y Vite
        run: npm run build
      - name: Validar paquetes PBR reales
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync("public/models/manifest.json","utf8"));
          if(!manifest.materials?.velvet)throw Error("Falta terciopelo real PBR");
          for(const key of ["color","normal","arm"]){
            const url=manifest.materials.velvet[key];
            if(!url||!fs.existsSync("public"+url))throw Error("Falta mapa "+key);
            const buffer=fs.readFileSync("public"+url);
            if(buffer.length<2000)throw Error("Mapa corrupto: "+key);
            console.log(key,buffer.length,"bytes");
          }
          '
      - name: Preparar navegadores
        run: npx playwright install --with-deps chromium
      - name: Probar Android vertical y escritorio
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Guardar capturas visuales de Android y escritorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teatro-auditoria-visual
          if-no-files-found: warn
          retention-days: 7
          path: |
            games/la-ultima-funcion/test-results/**/01-entrada.png
            games/la-ultima-funcion/test-results/**/01b-carta-mision.png
            games/la-ultima-funcion/test-results/**/02-teatro.png
            games/la-ultima-funcion/test-results/**/03-acomodador.png
            games/la-ultima-funcion/test-results/**/04-filas-senalizadas.png
            games/la-ultima-funcion/test-results/**/05-asiento-3-8.png
      - name: Guardar resultados si hay fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teatro-pruebas
          path: games/la-ultima-funcion/test-results
