name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Validate gift previews and media uploads
        run: node --test scripts/studio-media-audit.mjs

      - name: Validate commercial prices and payment boundaries
        run: node --test scripts/pricing-commercial-qa.mjs

      - name: Verify buyer-facing product consistency and private-route CTA regressions
        run: node --test tests/*.test.mjs

      - name: Verify native payments and purchase-email retry routing
        run: node scripts/audit-native-mp-cutover.mjs

      - name: Audit verified purchase alerts without network sends
        run: node scripts/ops-notice-launch-audit.mjs

      - name: Protect the permanent purchase, game and model contracts
        run: node scripts/release-contract.mjs --static

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
