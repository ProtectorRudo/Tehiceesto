name: Publish Pareja premium once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-once-pareja.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe TeHiceEsto deployment target
        run: |
          node --input-type=module <<'NODE'
          const {VERCEL_TOKEN:token,VERCEL_ORG_ID:org,VERCEL_PROJECT_ID:project}=process.env;
          if(!token || !org || !project) throw new Error("Missing publishing secrets. No deployment attempted.");
          const url="https://api.vercel.com/v9/projects/"+encodeURIComponent(project)+"?teamId="+encodeURIComponent(org);
          const response=await fetch(url,{headers:{Authorization:"Bearer "+token}});
          if(!response.ok) throw new Error("Vercel project inspection failed: "+response.status+". No deployment attempted.");
          const details=await response.json();
          const identity=(details.name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
          if(!identity.startsWith("tehiceesto")) throw new Error("Target is not a dedicated TeHiceEsto project: "+details.name+". Publishing blocked.");
          const domain=await fetch("https://api.vercel.com/v9/projects/"+encodeURIComponent(project)+"/domains?teamId="+encodeURIComponent(org),{headers:{Authorization:"Bearer "+token}});
          if(!domain.ok) throw new Error("Cannot verify project domain. Publishing blocked.");
          const domains=await domain.json();
          if(!(domains.domains||[]).some(d=>["tehiceesto.com","www.tehiceesto.com"].includes(d.name))) throw new Error("The target is not linked to tehiceesto.com. Publishing blocked.");
          console.log("Target verified:",details.name,"tehiceesto.com");
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci && npm install --no-save vercel@latest
      - name: Pull
        run: npx vercel pull --yes --environment=production
      - name: Build
        run: npx vercel build --prod
      - name: Publish reviewed source
        run: npx vercel deploy --prebuilt --prod --yes
      - name: Verify production SHA
        run: |
          for i in {1..25}; do
            value="$(curl -fsSL --max-time 20 https://tehiceesto.com/api/version || true)"
            if printf '%s' "$value" | grep -q "$GITHUB_SHA"; then exit 0; fi
            sleep 5
          done
          echo "::error::tehiceesto.com does not serve this commit."
          exit 1
