name: Atelier render preview publication
on:
  push:
    branches: [lab/blender-cycles-nacar-20261126]
    paths: ['.github/workflows/atelier-render-preview.yml']
permissions:
  contents: write
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve completed test render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45918750863 -R "$GITHUB_REPOSITORY" -n atelier-nacar-cycles-lab -D /tmp/nacar
          test -s /tmp/nacar/nacar-cycles.png
          python - <<'PY'
          import json,base64
          with open('/tmp/nacar/nacar-cycles.png','rb') as f:
              data=base64.b64encode(f.read()).decode()
          with open('/tmp/payload.json','w') as f:
              json.dump({'message':'lab: publish first Cycles material preview','content':data,'branch':'lab/blender-cycles-nacar-20261126'},f)
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/lab-preview/nacar-cycles-v1.png" --input /tmp/payload.json --jq '.content.download_url'
