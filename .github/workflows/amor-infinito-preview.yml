name: Amor infinito — isolated preview

on:
  push:
    branches:
      - feat/amor-infinito-recorrido
    paths:
      - 'app/experiencias/infinito/**'
      - '.github/workflows/amor-infinito-preview.yml'

permissions:
  contents: read

concurrency:
  group: amor-infinito-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Confirm this is only the isolated demo branch
        env:
          BRANCH: ${{ github.ref }}
        run: test "$BRANCH" = "refs/heads/feat/amor-infinito-recorrido"

      - name: Check target project and presence of deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing Vercel token"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing Vercel org"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_1VcOY4n08AEPMH9ltaRLBRJZstKt" || { echo "::error::Wrong project"; exit 1; }

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build source and verify types
        run: |
          npm ci --no-audit
          npx tsc --noEmit
          npm run build

      - name: Install pinned Vercel CLI
        run: npm install --global --ignore-scripts vercel@65.10.0

      - name: Pull preview environment without production changes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview

      - name: Build Vercel preview artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build

      - name: Publish preview only
        id: publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(vercel deploy --prebuilt --yes)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $url"

      - name: Report preview link for review
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          echo "### Temporary review deployment (not production)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL/experiencias/infinito" >> "$GITHUB_STEP_SUMMARY"
