name: Live Render and Vercel proxy QA

on:
  push:
    branches:
      - qa/render-public-smoke-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright for mobile smoke
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify external deployment and CDN proxy without real payments
        run: node scripts/external-deployment-smoke.mjs
      - name: Diagnose canonical commercial login routes
        run: node scripts/diagnose-commercial-login.mjs
      - name: Verify canonical-home staging route and old customer access
        run: node scripts/qa-canonical-new-home.mjs
      - name: Verify live new design on canonical host, preserve old paid gifts
        run: node scripts/verify-new-commercial-home.mjs
      - name: Validate nine persuasive stories and mobile card layout in production
        run: node scripts/verify-gift-card-stories.mjs
      - name: Verify Dragon Ball production demo replay and paid gifts remain independent
        env:
          AUDIT_BASE_URL: https://tehiceesto.com
        run: node scripts/dragon-ball-production-replay-audit.mjs
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-render-vercel-proxy-qa
          path: visual-smoke/live-proxy
          retention-days: 7
