name: Production visual audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-audit.yml"
      - "scripts/visual-audit.mjs"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for production and audit
        run: |
          for i in {1..18}; do
            if curl -fsSL https://tehiceesto.com | grep -q "TE HICE ESTO"; then
              break
            fi
            sleep 10
          done
          node scripts/visual-audit.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-visual-audit
          path: visual-audit/
          retention-days: 7
