name: Production visual audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-audit.yml"
      - "scripts/visual-audit.mjs"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app and Playwright
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Audit real production
        env:
          AUDIT_BASE_URL: https://tehiceesto.com
          AUDIT_OUTPUT_DIR: visual-audit-production
          AUDIT_DEMOS: "false"
        run: node scripts/visual-audit.mjs

      - name: Build current main
        run: npm run build

      - name: Start current main
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/tehiceesto-next.log 2>&1 &
          echo $! > /tmp/tehiceesto-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tehiceesto-next.log
          exit 1

      - name: Audit current main
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_OUTPUT_DIR: visual-audit-main
        run: node scripts/visual-audit.mjs

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-visual-audit
          path: |
            visual-audit-production/
            visual-audit-main/
          retention-days: 7
