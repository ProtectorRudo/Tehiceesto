name: Verify native Vercel production release
on:
  push:
    branches: [qa/render-public-smoke-20261102]
    paths:
      - "scripts/verify-vercel-native-release.mjs"
      - ".github/workflows/verify-vercel-native-release.yml"
permissions:
  contents: read
jobs:
  public-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check native Vercel production SHA and mobile gift pages
        run: node scripts/verify-vercel-native-release.mjs
