<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">Dos personas mirando juntas un atardecer</title>
<desc id="desc">Ilustración cálida y original de una pareja abrazada, rodeada de montañas suaves, corazones y una puesta de sol.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE9E6"/><stop offset=".43" stop-color="#F8D7E9"/><stop offset="1" stop-color="#DFC6EC"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFEFCC"/><stop offset="1" stop-color="#FEBFC4"/></linearGradient>
<linearGradient id="hills" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8B6CD"/><stop offset="1" stop-color="#CDA5D9"/></linearGradient>
<linearGradient id="shirt1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B96D94"/><stop offset="1" stop-color="#82466D"/></linearGradient>
<linearGradient id="shirt2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF6EE"/><stop offset="1" stop-color="#EDD3D8"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#663B47"/><stop offset="1" stop-color="#3C2839"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#fff8e0" stop-opacity=".95"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></radialGradient>
<filter id="softShadow"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
